name: Bug
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev
        - Production
        - Local
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
