name: Error
description: Algo no funciona como debería.
labels: ["error"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre ...
        2. Pulsa ...
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - dev
        - Producción
        - Local
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Capturas o registros
